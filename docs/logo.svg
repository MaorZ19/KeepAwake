<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="KeepAwake sun and crescent moon app icon">
  <defs>
    <linearGradient id="bg" x1="128" y1="112" x2="896" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27367f"/>
      <stop offset="0.46" stop-color="#301766"/>
      <stop offset="1" stop-color="#120d38"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0" cy="0" r="1" gradientTransform="translate(279 624) rotate(-18) scale(550 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8f6b" stop-opacity="0.44"/>
      <stop offset="0.56" stop-color="#8f4ac8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#251348" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="330" y1="351" x2="596" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7ac"/>
      <stop offset="0.46" stop-color="#ffd45c"/>
      <stop offset="1" stop-color="#ff8c3f"/>
    </linearGradient>
    <linearGradient id="moon" x1="540" y1="330" x2="800" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f8ff"/>
      <stop offset="0.52" stop-color="#ccd4ff"/>
      <stop offset="1" stop-color="#8e9be8"/>
    </linearGradient>
    <linearGradient id="rim" x1="180" y1="100" x2="790" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#05021b" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="tileShadow" x="20" y="20" width="984" height="1004" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#09031f" flood-opacity="0.36"/>
    </filter>
    <filter id="sunGlow" x="182" y="250" width="548" height="548" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#ff9b3d" flood-opacity="0.50"/>
    </filter>
    <filter id="moonShadow" x="400" y="240" width="520" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="18" flood-color="#05031f" flood-opacity="0.42"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
    <mask id="crescent" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="black"/>
      <circle cx="648" cy="512" r="196" fill="white"/>
      <circle cx="560" cy="486" r="180" fill="black"/>
    </mask>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
    <g clip-path="url(#tileClip)">
      <rect x="64" y="64" width="896" height="896" fill="url(#dawn)"/>
      <ellipse cx="512" cy="922" rx="390" ry="165" fill="#090627" opacity="0.22"/>

      <g fill="#ffffff">
        <path d="M767 253l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" opacity="0.92"/>
        <path d="M821 390l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity="0.64"/>
        <circle cx="707" cy="216" r="6" opacity="0.50"/>
      </g>

      <g stroke="#ffd96b" stroke-width="28" stroke-linecap="round" opacity="0.98">
        <path d="M426 276v-52"/>
        <path d="M426 800v-52"/>
        <path d="M188 512h52"/>
        <path d="M260 346l37 37"/>
        <path d="M260 678l37-37"/>
        <path d="M592 346l-37 37"/>
        <path d="M592 678l-37-37"/>
      </g>

      <circle cx="426" cy="512" r="184" fill="url(#sun)" filter="url(#sunGlow)"/>
      <circle cx="378" cy="458" r="82" fill="#fffbd0" opacity="0.16"/>

      <g filter="url(#moonShadow)">
        <circle cx="648" cy="512" r="196" fill="url(#moon)" mask="url(#crescent)"/>
      </g>

      <rect x="75" y="75" width="874" height="874" rx="189" fill="none" stroke="url(#rim)" stroke-width="22"/>
    </g>
  </g>
</svg>
